<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCHUB - Seamless Collaborative Writing</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- SockJS and Stomp -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    
    <!-- Quill.js Editor & Cursors -->
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill-cursors@3.1.0/dist/quill-cursors.min.js"></script>
</head>
<body>

    <div id="login-view" class="view active">
        <div class="login-card glass-panel">
            <h1>DOC<span>HUB</span></h1>
            <p>Welcome back! Please login to continue.</p>
            <div class="form-group">
                <input type="text" id="username" placeholder="Username (e.g. admin)">
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password (e.g. admin123)">
            </div>
            <button id="login-btn" class="primary-btn">Login</button>
            <div id="login-error" class="error-msg"></div>
        </div>
    </div>

    <div id="dashboard-view" class="view">
        <header class="glass-header">
            <div class="logo">DOC<span>HUB</span></div>
            <div class="user-info">
                <span id="welcome-user"></span>
                <button id="logout-btn" class="secondary-btn">Logout</button>
            </div>
        </header>
        
        <main class="dashboard-content">
            <div class="dashboard-header">
                <h2>Your Documents</h2>
                <button id="new-doc-btn" class="primary-btn">+ Create Document</button>
            </div>
            
            <div class="document-grid" id="document-list">
                <!-- Dynamically populated -->
            </div>
        </main>
    </div>

    <div id="editor-view" class="view">
        <header class="glass-header editor-header">
            <button id="back-btn" class="secondary-btn">← Back to Dashboard</button>
            <div class="doc-info">
                <h2 id="editor-doc-title">Document Title</h2>
                <span class="status-badge" id="doc-status-badge">Editing</span>
            </div>
            <div class="active-users" id="active-users-list">
                <div class="user-avatar" title="You">Y</div>
            </div>
        </header>

        <main class="editor-workspace">
            <div id="editor-container" class="workspace-editor glass-panel"></div>
            <div id="typing-indicator" class="typing-indicator" style="display: none;"></div>
            <div class="status-bar">
                <span id="sync-status" class="sync-status">● Connected</span>
                <span id="version-display">Version: 1</span>
            </div>
        </main>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="js/app.js"></script>
</body>
</html>
